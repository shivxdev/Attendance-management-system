<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Management | Attendance Management System</title>

    <link
        rel="stylesheet"
        href="css/student-management.css"
    >

</head>


<body>

    <!-- =========================================
         NAVBAR
    ========================================== -->

    <header class="navbar">

        <div class="brand">

            <div class="brand-logo">
                AMS
            </div>

            <div>
                <h2>Attendance</h2>
                <span>MANAGEMENT SYSTEM</span>
            </div>

        </div>


        <div class="admin-profile">

            <div class="admin-info">

                <span class="profile-label">
                    Administrator
                </span>

                <strong id="adminName">
                    Admin
                </strong>

            </div>

            <button
                id="backBtn"
                class="back-btn"
            >
                ← Dashboard
            </button>

            <button
                id="logoutBtn"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="container">


        <!-- =====================================
             PAGE HEADER
        ====================================== -->

        <section class="page-header">

            <div>

                <span class="section-tag">
                    ADMIN PANEL
                </span>

                <h1>
                    Student Management
                </h1>

                <p>
                    Add, view and manage student records.
                </p>

            </div>

            <button
                id="addStudentBtn"
                class="primary-btn"
            >
                + Add Student
            </button>

        </section>



        <!-- =====================================
             ADD STUDENT FORM
        ====================================== -->

        <section
            id="studentFormSection"
            class="form-section hidden"
        >

            <div class="section-heading">

                <div>

                    <span class="section-tag">
                        NEW RECORD
                    </span>

                    <h2>
                        Add New Student
                    </h2>

                </div>

                <button
                    id="closeFormBtn"
                    class="close-btn"
                >
                    ✕
                </button>

            </div>


            <form id="studentForm">


                <div class="form-grid">


                    <!-- Username -->

                    <div class="form-group">

                        <label for="username">
                            Username *
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="e.g. aman.student"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password *
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >

                    </div>


                    <!-- Roll Number -->

                    <div class="form-group">

                        <label for="universityRollNo">
                            University Roll No. *
                        </label>

                        <input
                            type="text"
                            id="universityRollNo"
                            placeholder="e.g. 2026CSE002"
                            required
                        >

                    </div>


                    <!-- Student Name -->

                    <div class="form-group">

                        <label for="studentName">
                            Student Name *
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            placeholder="Enter student name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email *
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="student@gmail.com"
                            required
                        >

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="text"
                            id="phone"
                            placeholder="9876543210"
                        >

                    </div>


                    <!-- Year -->

                    <div class="form-group">

                        <label for="year">
                            Year *
                        </label>

                        <select id="year" required>

                            <option value="">
                                Select Year
                            </option>

                            <option value="1">
                                1st Year
                            </option>

                            <option value="2">
                                2nd Year
                            </option>

                            <option value="3">
                                3rd Year
                            </option>

                            <option value="4">
                                4th Year
                            </option>

                        </select>

                    </div>


                    <!-- Branch -->

                    <div class="form-group">

                        <label for="branch">
                            Branch *
                        </label>

                        <input
                            type="text"
                            id="branch"
                            placeholder="Computer Science and Engineering"
                            required
                        >

                    </div>


                    <!-- Section -->

                    <div class="form-group">

                        <label for="section">
                            Section *
                        </label>

                        <input
                            type="text"
                            id="section"
                            placeholder="A"
                            required
                        >

                    </div>


                    <!-- Semester -->

                    <div class="form-group">

                        <label for="semester">
                            Semester *
                        </label>

                        <select id="semester" required>

                            <option value="">
                                Select Semester
                            </option>

                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>

                        </select>

                    </div>


                    <!-- Class -->

                    <div class="form-group">

                        <label for="classId">
                            Class *
                        </label>

                        <select id="classId" required>

                            <option value="">
                                Loading classes...
                            </option>

                        </select>

                    </div>

                </div>



                <!-- Form message -->

                <div
                    id="formMessage"
                    class="form-message"
                ></div>



                <!-- Form actions -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="secondary-btn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="saveStudentBtn"
                        class="primary-btn"
                    >
                        Save Student
                    </button>

                </div>


            </form>

        </section>



        <!-- =====================================
             STUDENT LIST
        ====================================== -->

        <section class="students-section">


            <div class="section-heading">

                <div>

                    <span class="section-tag">
                        STUDENT RECORDS
                    </span>

                    <h2>
                        All Students
                    </h2>

                </div>


                <button
                    id="refreshBtn"
                    class="secondary-btn"
                >
                    ↻ Refresh
                </button>

            </div>



            <!-- Loading -->

            <div
                id="loadingMessage"
                class="loading-message"
            >
                Loading students...
            </div>



            <!-- Table -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Roll No.
                            </th>

                            <th>
                                Student Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Class
                            </th>

                            <th>
                                Year
                            </th>

                            <th>
                                Section
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="studentTableBody">

                    </tbody>

                </table>

            </div>


        </section>


    </main>



    <script src="js/student-management.js"></script>

</body>

</html>
