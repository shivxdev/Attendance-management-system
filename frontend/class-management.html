<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Class Management | Attendance Management System</title>

    <link
        rel="stylesheet"
        href="css/class-management.css"
    >

</head>

<body>

    <!-- =========================================
         NAVBAR
    ========================================== -->

    <header class="navbar">

        <div class="brand">

            <div class="brand-logo">
                AMS
            </div>

            <div>
                <h2>Attendance</h2>
                <span>MANAGEMENT SYSTEM</span>
            </div>

        </div>

        <div class="admin-profile">

            <div class="admin-info">

                <span class="profile-label">
                    Administrator
                </span>

                <strong id="adminName">
                    Admin
                </strong>

            </div>

            <button
                id="backBtn"
                class="back-btn"
            >
                ← Dashboard
            </button>

        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="container">


        <!-- =====================================
             PAGE HEADER
        ====================================== -->

        <section class="page-header">

            <span class="section-tag">
                ADMIN PANEL
            </span>

            <h1>
                Class Management
            </h1>

            <p>
                Create, view and manage college classes.
            </p>

        </section>


        <!-- =====================================
             ADD CLASS
        ====================================== -->

        <section class="form-section">

            <div class="section-heading">

                <div>

                    <span class="section-tag">
                        CREATE CLASS
                    </span>

                    <h2>
                        Add New Class
                    </h2>

                </div>

            </div>


            <form id="classForm">


                <!-- YEAR -->

                <div class="form-group">

                    <label for="year">
                        Year
                    </label>

                    <select
                        id="year"
                        required
                    >

                        <option value="">
                            Select Year
                        </option>

                        <option value="1">
                            1st Year
                        </option>

                        <option value="2">
                            2nd Year
                        </option>

                        <option value="3">
                            3rd Year
                        </option>

                        <option value="4">
                            4th Year
                        </option>

                    </select>

                </div>


                <!-- BRANCH -->

                <div class="form-group">

                    <label for="branch">
                        Branch
                    </label>

                    <input
                        type="text"
                        id="branch"
                        placeholder="e.g. Computer Science and Engineering"
                        required
                    >

                </div>


                <!-- SECTION -->

                <div class="form-group">

                    <label for="section">
                        Section
                    </label>

                    <input
                        type="text"
                        id="section"
                        placeholder="e.g. A"
                        required
                    >

                </div>


                <!-- SEMESTER -->

                <div class="form-group">

                    <label for="semester">
                        Semester
                    </label>

                    <select
                        id="semester"
                        required
                    >

                        <option value="">
                            Select Semester
                        </option>

                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>

                    </select>

                </div>


                <!-- CLASS ID -->

                <div class="form-group full-width">

                    <label for="classId">
                        Class ID
                    </label>

                    <input
                        type="text"
                        id="classId"
                        placeholder="e.g. CSE-2-A-3"
                        required
                    >

                    <small>
                        Class ID must be unique.
                    </small>

                </div>


                <!-- BUTTON -->

                <div class="form-actions">

                    <button
                        type="submit"
                        id="addClassBtn"
                        class="primary-btn"
                    >
                        Add Class →
                    </button>

                </div>

            </form>

            <p
                id="formMessage"
                class="form-message"
            ></p>

        </section>


        <!-- =====================================
             ALL CLASSES
        ====================================== -->

        <section class="table-section">

            <div class="section-heading">

                <div>

                    <span class="section-tag">
                        EXISTING CLASSES
                    </span>

                    <h2>
                        All Classes
                    </h2>

                </div>

                <button
                    id="refreshBtn"
                    class="refresh-btn"
                >
                    ↻ Refresh
                </button>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Class ID
                            </th>

                            <th>
                                Year
                            </th>

                            <th>
                                Branch
                            </th>

                            <th>
                                Section
                            </th>

                            <th>
                                Semester
                            </th>

                            <th>
                                Created
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody id="classTableBody">

                        <tr>

                            <td
                                colspan="7"
                                class="loading"
                            >
                                Loading classes...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>


    </main>


    <script src="js/class-management.js"></script>

</body>

</html>
